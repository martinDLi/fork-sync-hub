name: cloud fork sync
on:
  schedule:
    # 每 2 个日历日 00:00 UTC（北京 08:00）；cron 是日历语义，非严格 48 小时间隔
    - cron: "0 0 */2 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "sync / init-tags / restore"
        required: false
        default: "sync"
      repo:
        description: "restore 时指定单个仓库名，留空表示全部"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: cloud-fork-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run cloud sync
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          MODE: ${{ inputs.mode || 'sync' }}
          TARGET_REPO: ${{ inputs.repo || '' }}
        run: python scripts/cloud_sync.py
      - name: Surface failures
        if: failure()
        run: echo "::error::cloud fork sync 存在需关注项，请查看 Step Summary 与上方日志"
